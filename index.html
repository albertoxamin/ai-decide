<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>actually let ai decide — can't decide?</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Rye&family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=JetBrains+Mono:wght@400;600&display=swap"
    rel="stylesheet"
  />
  <style>
    :root {
      color-scheme: light;
      --paper:      #f1e6cb;
      --paper-hi:   #fbf4dd;
      --ink:        #1b110a;
      --ink-soft:   #5a4232;
      --rule:       #b89e6f;
      --accent:     #c83a1e;  /* vermilion */
      --accent-hi:  #e35636;
      --gold:       #d99a2b;  /* mustard */
      --teal:       #2c5d52;
      --shadow:     6px 6px 0 var(--ink);
      --shadow-sm:  3px 3px 0 var(--ink);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: 'Fraunces', 'Iowan Old Style', 'Hoefler Text', Georgia, serif;
      font-optical-sizing: auto;
      font-variation-settings: "SOFT" 50, "WONK" 0;
      font-size: 17px;
      line-height: 1.55;
      color: var(--ink);
      background-color: var(--paper);
      background-image:
        radial-gradient(ellipse 70% 50% at 50% -5%, rgba(217, 154, 43, 0.32) 0%, transparent 65%),
        radial-gradient(ellipse 80% 60% at 100% 110%, rgba(44, 93, 82, 0.18) 0%, transparent 60%),
        radial-gradient(circle at 50% 50%, rgba(27, 17, 10, 0.04) 1px, transparent 1.5px);
      background-size: auto, auto, 6px 6px;
      background-attachment: fixed, fixed, fixed;
      min-height: 100vh;
      overflow-x: hidden;
    }
    /* Paper grain overlay */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      opacity: 0.5;
      mix-blend-mode: multiply;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' seed='3'/><feColorMatrix values='0 0 0 0 0.108  0 0 0 0 0.066  0 0 0 0 0.039  0 0 0 0.18 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    }

    /* Decorative star burst floating in the corner */
    body::after {
      content: "";
      position: fixed;
      top: 18px;
      right: 24px;
      width: 56px;
      height: 56px;
      pointer-events: none;
      z-index: 2;
      opacity: 0.55;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><g fill='%23c83a1e'><path d='M50 5 L55 45 L95 50 L55 55 L50 95 L45 55 L5 50 L45 45 Z'/></g></svg>");
      background-repeat: no-repeat;
      background-size: contain;
      animation: slowSpin 24s linear infinite;
    }
    @keyframes slowSpin {
      to { transform: rotate(360deg); }
    }

    main { position: relative; z-index: 3; }

    header {
      max-width: 760px;
      margin: 0 auto;
      padding: 56px 24px 18px;
      text-align: center;
    }

    /* Marquee bulb frame around the title pill. Built from a repeating SVG so
       the bulbs stay crisp and don't pollute the DOM. */
    .marquee {
      display: inline-block;
      position: relative;
      padding: 22px 56px 26px;
      background: var(--paper-hi);
      border: 3px solid var(--ink);
      border-radius: 999px;
      box-shadow: var(--shadow);
      transform: rotate(-1.2deg);
    }
    .marquee::before,
    .marquee::after {
      content: "";
      position: absolute;
      pointer-events: none;
    }
    /* Top + bottom bulb rows */
    .marquee::before {
      left: 28px;
      right: 28px;
      top: -14px;
      bottom: -14px;
      background-image:
        url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='26' height='26' viewBox='0 0 26 26'><circle cx='13' cy='13' r='5' fill='%23d99a2b' stroke='%231b110a' stroke-width='1.5'/><circle cx='11' cy='11' r='1.6' fill='%23fff5d6'/></svg>"),
        url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='26' height='26' viewBox='0 0 26 26'><circle cx='13' cy='13' r='5' fill='%23d99a2b' stroke='%231b110a' stroke-width='1.5'/><circle cx='11' cy='11' r='1.6' fill='%23fff5d6'/></svg>");
      background-repeat: repeat-x, repeat-x;
      background-position: top center, bottom center;
      background-size: 26px 26px;
      animation: bulbChase 1.4s steps(7) infinite;
    }
    /* Left + right arcs of bulbs, hand-placed via box-shadow on a single dot */
    .marquee::after {
      left: 0;
      right: 0;
      top: 50%;
      height: 0;
      pointer-events: none;
      /* Cluster of bulbs hugging the rounded ends */
      background:
        radial-gradient(circle 4px at 0 0, #d99a2b 0 4px, transparent 5px) no-repeat -22px 0,
        radial-gradient(circle 4px at 0 0, #d99a2b 0 4px, transparent 5px) no-repeat -22px -22px,
        radial-gradient(circle 4px at 0 0, #d99a2b 0 4px, transparent 5px) no-repeat -22px 22px,
        radial-gradient(circle 4px at 0 0, #d99a2b 0 4px, transparent 5px) no-repeat calc(100% + 22px) 0,
        radial-gradient(circle 4px at 0 0, #d99a2b 0 4px, transparent 5px) no-repeat calc(100% + 22px) -22px,
        radial-gradient(circle 4px at 0 0, #d99a2b 0 4px, transparent 5px) no-repeat calc(100% + 22px) 22px;
      filter: drop-shadow(0 0 1px #1b110a);
      animation: bulbChase 1.4s steps(7) infinite reverse;
    }
    @keyframes bulbChase {
      0%, 49%  { filter: none; }
      50%,100% { filter: brightness(1.35) drop-shadow(0 0 6px rgba(217,154,43,0.85)); }
    }

    .kicker {
      display: block;
      font-family: 'Fraunces', Georgia, serif;
      font-style: italic;
      font-weight: 500;
      font-size: 19px;
      letter-spacing: 0;
      color: var(--teal);
      margin-bottom: 10px;
      text-transform: none;
    }
    .kicker::before, .kicker::after {
      content: "✦";
      color: var(--gold);
      font-style: normal;
      margin: 0 10px;
      font-size: 12px;
      vertical-align: 3px;
    }
    header h1 {
      font-family: 'Rye', 'Times New Roman', serif;
      font-size: clamp(40px, 7vw, 64px);
      line-height: 0.95;
      letter-spacing: 0.01em;
      color: var(--accent);
      margin: 0;
      text-shadow:
        2px 2px 0 var(--gold),
        4px 4px 0 var(--ink);
    }
    header .tagline {
      margin: 22px auto 0;
      max-width: 460px;
      font-style: italic;
      font-size: 17.5px;
      color: var(--ink-soft);
      line-height: 1.4;
    }
    header .tagline .num {
      font-family: 'Rye', serif;
      font-size: 22px;
      font-style: normal;
      color: var(--accent);
      padding: 0 2px;
    }

    .panel-wrap {
      max-width: 720px;
      margin: 8px auto 64px;
      padding: 0 22px;
      position: relative;
    }

    .panel {
      position: relative;
      background:
        repeating-linear-gradient(
          0deg,
          transparent 0,
          transparent 28px,
          rgba(27, 17, 10, 0.035) 28px,
          rgba(27, 17, 10, 0.035) 29px
        ),
        var(--paper-hi);
      border: 3px solid var(--ink);
      box-shadow: var(--shadow);
      padding: 36px 32px 28px;
    }
    /* Inner double-rule border */
    .panel::before {
      content: "";
      position: absolute;
      inset: 8px;
      border: 1px solid var(--ink);
      pointer-events: none;
    }
    /* Corner ornament glyphs */
    .panel .corner {
      position: absolute;
      width: 26px; height: 26px;
      background: var(--paper-hi);
      border: 2px solid var(--ink);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Rye', serif;
      font-size: 14px;
      color: var(--accent);
      pointer-events: none;
    }
    .panel .corner.tl { top: -14px; left: -14px; }
    .panel .corner.tr { top: -14px; right: -14px; }
    .panel .corner.bl { bottom: -14px; left: -14px; }
    .panel .corner.br { bottom: -14px; right: -14px; }

    label.field { display: block; margin-bottom: 20px; }
    label.field > span.label-text {
      display: block;
      font-family: 'Rye', serif;
      font-size: 12.5px;
      letter-spacing: 0.32em;
      color: var(--ink);
      margin-bottom: 8px;
      text-transform: uppercase;
    }
    label.field > span.label-text::before,
    label.field > span.label-text::after {
      content: "✦";
      color: var(--gold);
      margin: 0 8px;
      font-size: 11px;
      vertical-align: 2px;
    }
    label.field > span.label-text::before { margin-left: 0; }

    textarea#names, select, input[type="number"] {
      width: 100%;
      font-family: 'Fraunces', Georgia, serif;
      font-size: 18px;
      color: var(--ink);
      background: var(--paper);
      border: 2px solid var(--ink);
      border-radius: 2px;
      padding: 13px 16px;
      transition: box-shadow 0.18s, transform 0.18s, background 0.18s;
    }
    textarea#names {
      min-height: 150px;
      line-height: 1.55;
      resize: vertical;
    }
    select {
      appearance: none;
      padding-right: 44px;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='10' viewBox='0 0 14 10'><path d='M1 1 L7 9 L13 1' stroke='%231b110a' stroke-width='2' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>");
      background-repeat: no-repeat;
      background-position: right 16px center;
    }
    textarea#names:focus, select:focus, input:focus {
      outline: none;
      box-shadow: 4px 4px 0 var(--accent);
      transform: translate(-2px, -2px);
      background: var(--paper-hi);
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 22px;
      align-items: flex-end;
      margin-top: 4px;
    }
    .row > label.field { flex: 1 1 220px; margin-bottom: 0; }

    .button-row {
      display: flex;
      gap: 16px;
      margin-top: 28px;
      flex-wrap: wrap;
      align-items: stretch;
    }
    button.primary, button.secondary {
      font-family: 'Rye', serif;
      font-size: 18px;
      letter-spacing: 0.06em;
      padding: 16px 30px;
      border: 3px solid var(--ink);
      border-radius: 2px;
      cursor: pointer;
      text-transform: uppercase;
      transition: transform 0.08s ease-out, box-shadow 0.08s ease-out, background 0.18s;
    }
    button.primary {
      background: var(--accent);
      color: var(--paper-hi);
      box-shadow: 6px 6px 0 var(--ink);
      text-shadow: 1px 1px 0 rgba(0,0,0,0.25);
    }
    button.primary:hover {
      background: var(--accent-hi);
      transform: translate(-1px, -1px);
      box-shadow: 7px 7px 0 var(--ink);
    }
    button.primary:active {
      transform: translate(4px, 4px);
      box-shadow: 2px 2px 0 var(--ink);
    }
    button.secondary {
      background: var(--paper);
      color: var(--ink);
      box-shadow: 6px 6px 0 var(--ink);
    }
    button.secondary:hover {
      background: var(--gold);
      transform: translate(-1px, -1px);
      box-shadow: 7px 7px 0 var(--ink);
    }
    button.secondary:active {
      transform: translate(4px, 4px);
      box-shadow: 2px 2px 0 var(--ink);
    }

    .preview {
      margin-top: 26px;
      padding-top: 22px;
      border-top: 2px dashed var(--rule);
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .preview:empty { display: none; }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 5px 16px 5px 5px;
      background: var(--paper);
      border: 2px solid var(--ink);
      border-radius: 999px;
      font-size: 15.5px;
      font-weight: 500;
      box-shadow: var(--shadow-sm);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .chip:hover {
      transform: translate(-1px, -1px);
      box-shadow: 4px 4px 0 var(--ink);
    }
    .chip img {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      object-fit: cover;
      border: 1.5px solid var(--ink);
    }

    .hint {
      margin-top: 26px;
      padding-top: 18px;
      border-top: 2px solid var(--ink);
      font-size: 14.5px;
      font-style: italic;
      color: var(--ink-soft);
      line-height: 1.65;
    }
    .hint b {
      font-style: normal;
      font-family: 'Rye', serif;
      font-weight: 400;
      letter-spacing: 0.08em;
      color: var(--ink);
      font-size: 13px;
      margin-right: 4px;
      text-transform: uppercase;
    }
    .hint code {
      background: var(--paper);
      padding: 2px 8px;
      border: 1.5px solid var(--rule);
      border-radius: 2px;
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-style: normal;
      font-size: 12.5px;
      color: var(--ink);
    }

    .toast {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--ink);
      color: var(--paper-hi);
      font-family: 'Rye', serif;
      font-size: 13px;
      padding: 13px 28px;
      border: 2px solid var(--ink);
      border-radius: 2px;
      box-shadow: 5px 5px 0 var(--accent);
      letter-spacing: 0.16em;
      text-transform: uppercase;
      z-index: 10005;
      pointer-events: none;
      animation: toastSlide 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes toastSlide {
      from { transform: translateX(-50%) translateY(24px); opacity: 0; }
      to   { transform: translateX(-50%) translateY(0); opacity: 1; }
    }

    /* Page load reveal */
    @keyframes risein {
      from { opacity: 0; transform: translateY(18px) rotate(-2deg); }
      to   { opacity: 1; transform: translateY(0) rotate(-1.2deg); }
    }
    @keyframes risein-panel {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .marquee { animation: risein 0.7s cubic-bezier(0.34, 1.5, 0.64, 1) 0.05s both; }
    header .tagline { animation: risein-panel 0.7s cubic-bezier(0.34, 1.5, 0.64, 1) 0.22s both; }
    .panel-wrap     { animation: risein-panel 0.75s cubic-bezier(0.34, 1.5, 0.64, 1) 0.34s both; }

    @media (max-width: 520px) {
      header { padding-top: 36px; }
      header h1 { text-shadow: 1.5px 1.5px 0 var(--gold), 3px 3px 0 var(--ink); }
      .marquee { padding: 18px 36px 22px; }
      .panel { padding: 28px 22px 22px; }
      .panel .corner { width: 22px; height: 22px; font-size: 12px; }
      button.primary, button.secondary { padding: 14px 22px; font-size: 16px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
      body::after { animation: none; }
    }
  </style>
</head>
<body>
  <header>
    <div class="marquee">
      <span class="kicker">can't decide?</span>
      <h1>let<br />ai decide</h1>
    </div>
    <p class="tagline">
      Thirty-four loadable fairground contraptions for picking <span class="num">1</span> name
      from a hat.
    </p>
  </header>
  <main>
    <div class="panel-wrap">
      <section class="panel">
        <span class="corner tl">★</span>
        <span class="corner tr">★</span>
        <span class="corner bl">★</span>
        <span class="corner br">★</span>

        <label class="field" for="names">
          <span class="label-text">The Roster</span>
          <textarea
            id="names"
            placeholder="One name per line, or comma-separated&#10;e.g. Ada, Linus, Grace"
          ></textarea>
        </label>
        <div class="row">
          <label class="field" for="picker">
            <span class="label-text">The Contraption</span>
            <select id="picker"></select>
          </label>
          <label class="field" for="time">
            <span class="label-text">Spin Time</span>
            <input id="time" type="number" min="0.8" max="8" step="0.1" value="3" />
          </label>
        </div>
        <div class="button-row">
          <button id="spin" class="primary" type="button">Spin the Wheel</button>
          <button id="share" class="secondary" type="button">Copy URL</button>
        </div>
        <div id="preview" class="preview" aria-live="polite"></div>
        <div class="hint">
          <b>Keys</b> <code>Space</code> / <code>Enter</code> spin &middot; <code>Esc</code> cancel.<br />
          <b>URL</b> <code>?c1=ada&amp;c2=linus&amp;time=5</code> (wheeldecide-style),
          or <code>?names=ada,linus&amp;picker=wheel&amp;time=5</code>.
        </div>
      </section>
    </div>
  </main>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
